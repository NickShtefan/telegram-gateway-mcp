name: Platform foundations
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - name: Common contracts and native pipe ownership
        run: npx --no-install vitest run src/install/__tests__/provision.test.ts src/core/__tests__/windowsLease.test.ts
  windows-sources:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse PowerShell entries without execution or elevation
        shell: powershell
        run: |
          Get-ChildItem scripts/install/*.ps1 | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw 'PowerShell parse failed' }
          }
      - name: Compile the fixed Windows service host
        shell: powershell
        run: |
          $compiler=Join-Path ([Environment]::GetFolderPath('Windows')) 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe /out:service-host.exe /r:System.ServiceProcess.dll /r:System.Web.Extensions.dll scripts/install/service-host.cs
          if ($LASTEXITCODE -ne 0) { throw 'Service host compile failed' }
